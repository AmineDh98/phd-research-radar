# Delivery: enable one or both channels independently
# -----------------------------------------------------------------------
delivery:
  mattermost:
    enabled: false
    as_attachment: false

  email:
    enabled: true
    as_attachment: false
    subject: "[DC04] Weekly Research Radar"
    to: aminedhemaied98.ad@gmail.com
    display_name: "DC04 Research Radar"
